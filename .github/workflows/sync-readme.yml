name: Sync profile README

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch README from portfolio repo
        run: curl -fsSL https://raw.githubusercontent.com/breynerciro/breynerciro.github.io/main/README.md -o README.md

      - name: Commit if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync profile README from portfolio"
          git push
